services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: ${PORTFOLIO_IMAGE:-phuttinan-portfolio:latest}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      LOCAL_STORAGE_DIR: /app/data/media
    expose:
      - "3000"
    volumes:
      - portfolio_media:/app/data/media
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/site').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks: [web]

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env.production}
      NGINX_ENVSUBST_FILTER: SITE_DOMAIN
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./ops/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${NGINX_CERTS_DIR:?Set NGINX_CERTS_DIR in .env.production}:/etc/nginx/certs:ro
    networks: [web]

networks:
  web:

volumes:
  portfolio_media:
